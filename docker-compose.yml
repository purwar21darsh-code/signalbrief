services:
  signalbrief:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalbrief-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/signalbrief?schema=public
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BIFROST_BASE_URL=${BIFROST_BASE_URL:-http://bifrost:8080/v1}
      - BIFROST_API_KEY=${BIFROST_API_KEY:-}
      - BIFROST_MODEL=${BIFROST_MODEL:-openai/gpt-4o-mini}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - FORCE_DEMO_MODE=${FORCE_DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      bifrost:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: signalbrief-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signalbrief
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signalbrief"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bifrost by Maxim AI. Configure a provider in its dashboard before live research.
  bifrost:
    image: maximhq/bifrost:v2.4.0
    container_name: signalbrief-bifrost
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - APP_PORT=8080
      - LOG_LEVEL=info
    volumes:
      - bifrost_data:/app/data

volumes:
  postgres_data:
  bifrost_data:
